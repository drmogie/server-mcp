[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-mcp"
version = "2026.10.23.7"
description = "MCP server that lets Claude manage Linux servers and Docker over SSH, with previews and approval for every change."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<2", "paramiko>=3"]

[project.scripts]
server-mcp = "server_mcp.server:main"

[tool.setuptools]
packages = ["server_mcp"]
